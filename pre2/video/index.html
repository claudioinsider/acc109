                // Clamp horizontal pra não sair da viewport em mobile
                var left = Math.max(8, Math.min(r.left, innerWidth - tipW - 8))
                var top = scrollY + r.top - 35
                // Se for sair pelo topo, joga pra baixo do botão
                if (top < scrollY + 8) top = scrollY + r.bottom + 8
                tip.style.top = top + "px"
                tip.style.left = left + "px"
                activeTooltip = tip
                tooltipTimer = setTimeout(removeTooltip, 3000)
              }
            },
            { passive: true },
          )
        }

        /* ============================================================
         * 5. Lead tracking — sub16 nos links de oferta apenas
         * ============================================================ */
        function setupLeads() {
          document
            .querySelectorAll("#bottles a, .smartplayer-click-event")
            .forEach(function (link) {
              link.addEventListener(
                "click",
                function () {
                  try {
                    var u = new URL(link.href)
                    u.searchParams.set("sub16", LEAD)
                    link.href = u.toString()
                  } catch (e) {}
                },
                { passive: true },
              )
            })
        }

        /* ============================================================
         * Bootstrap
         *    - postback: imediato (urgente, tracking)
         *    - comentários e player: imediato
         *    - listeners não-críticos: requestIdleCallback
         * ============================================================ */
        function idle(fn) {
          if ("requestIdleCallback" in window)
            requestIdleCallback(fn, { timeout: 1000 })
          else setTimeout(fn, 0)
        }

        function init() {
          postback()
          renderComments()
          setupPlayer()
          idle(setupComments)
          idle(setupLeads)
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init, { once: true })
        } else {
          init()
        }
      })()
    </script>
  </body>
</html>
